[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spencrr-agents"
version = "0.1.0"
description = "User-level coding-agent preferences with native installers."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{name = "Spencer Schoenberg"}]
dependencies = []

[project.scripts]
spencrr-agents = "spencrr_agents.__main__:main"

[project.urls]
Repository = "https://github.com/spencrr/agents"

[tool.setuptools]
packages = ["spencrr_agents"]

[tool.setuptools.package-data]
spencrr_agents = ["data/constitution.md", "data/python-development/SKILL.md"]
